# models/sales/sales.yml

models:
  - name: sales_daily_report
    description: "Provides a daily aggregated report of sales performance, including order counts, sales amounts by status, and average order value."
    columns:
      - name: order_date
        description: "The date (YYYY-MM-DD) for which the sales data is reported."
        tests:
          - not_null
      - name: orders_count
        description: "The total number of unique orders on this date."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_of_type:
              column_type: INT64 
      - name: shipped_sales_amount
        description: "The total sales amount for orders with 'Shipped' status on this date."
        tests:
          - not_null
           (or FLOAT64 if precision is less critical)
      - name: complete_sales_amount
        description: "The total sales amount for orders with 'Complete' status on this date."
        tests:
          - not_null
          
      - name: returned_sales_amount
        description: "The total sales amount for orders with 'Returned' status on this date."
        tests:
          - not_null
          
      - name: cancelled_sales_amount
        description: "The total sales amount for orders with 'Cancelled' status on this date."
        tests:
          - not_null
          
      - name: processing_sales_amount
        description: "The total sales amount for orders with 'Processing' status on this date."
        tests:
          - not_null
          
      - name: shipped_orders_count
        description: "The count of unique orders with 'Shipped' status on this date."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_of_type:
              column_type: INT64 
      - name: complete_orders_count
        description: "The count of unique orders with 'Complete' status on this date."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_of_type:
              column_type: INT64 
      - name: returned_orders_count
        description: "The count of unique orders with 'Returned' status on this date."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_of_type:
              column_type: INT64 
      - name: cancelled_orders_count
        description: "The count of unique orders with 'Cancelled' status on this date."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_of_type:
              column_type: INT64 
      - name: processing_orders_count
        description: "The count of unique orders with 'Processing' status on this date."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_of_type:
              column_type: INT64 
      - name: total_sales_amount
        description: "The total sales amount across all orders on this date."
        tests:
          - not_null
          
      - name: average_order_value
        description: "The average value of an order on this date (total_sales_amount / orders_count)."
        tests:
          - not_null
           (or FLOAT64 if 0.0 is acceptable for AOV from no sales)
