models:
  - name: order_items_product_details
    description: "Combines order item details with corresponding product information from TheLook eCommerce dataset."
    columns:
      - name: order_id
        description: "Unique identifier for the order."
        tests:
          - not_null
      - name: product_id
        description: "Unique identifier for the product."
        tests:
          - not_null
      - name: created_at
        description: "Timestamp when the order item was created/placed."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_of_type:
              column_type: TIMESTAMP 
      - name: status
        description: "Current status of the order item (e.g., 'Complete', 'Returned', 'Shipped')."
        tests:
          - not_null
      - name: returned_at
        description: "Timestamp when the order item was returned, if applicable."
      - name: sale_price
        description: "The price at which the product was sold in this order item."
        tests:
          - not_null
          #- dbt_expectations.expect_column_values_to_be_of_type:
              #column_type: NUMERIC , preferred for monetary values
      - name: product_name
        description: "Name of the product."
        tests:
          - not_null
      - name: category
        description: "Category of the product (e.g., 'Apparel', 'Electronics')."
        tests:
          - not_null
      - name: brand
        description: "Brand of the product."
      - name: retail_price
        description: "The original retail price of the product."
        tests:
          - not_null 
